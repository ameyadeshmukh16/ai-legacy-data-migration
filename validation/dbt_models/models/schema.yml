version: 2

seeds:
  - name: migration_counts_seed
    description: "Source vs target row counts per migrated table, generated from data/reconciliation_report.json."
    columns:
      - name: table_name
        tests:
          - not_null
          - unique
      - name: source_row_count
        tests:
          - not_null
      - name: target_row_count
        tests:
          - not_null

  - name: null_rates_seed
    description: "Per-column null rates in source vs target, generated from data/reconciliation_report.json."
    columns:
      - name: table_name
        tests:
          - not_null
      - name: column_name
        tests:
          - not_null

models:
  - name: row_count_reconciliation
    description: >
      Zero-row diagnostic. Any row here is a migrated table whose source and
      target row counts diverge. tests/assert_row_counts_match.sql fails dbt
      when this model returns rows.
    columns:
      - name: table_name
        tests:
          - not_null

  - name: null_rate_check
    description: >
      Zero-row diagnostic. Any row here is a column whose source-to-target null
      rate delta exceeds 2%. tests/assert_null_rates_match.sql fails dbt when
      this model returns rows.
    columns:
      - name: table_name
        tests:
          - not_null

  - name: fk_integrity_check
    description: >
      Zero-row diagnostic. Any row here is an orphaned appointments.pat_id with
      no matching patient_records.pat_id in the target.
      tests/assert_no_orphan_fks.sql fails dbt when this model returns rows.
